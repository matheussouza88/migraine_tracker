<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#12131c">
  <title>Migraine Tracker - {% block title %}{% endblock title %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1.3.0">
</head>
<body>
<header class="app-header">
  <div class="header-content">
    <h1>⚡ Migraine Tracker</h1>
    <p class="tagline">Monitor episodes &amp; medication intake</p>
  </div>
  <nav class="app-nav">
    <a href="{{ url_for('pages.home') }}" class="nav-tab {% if request.path == '/' %}active{% endif %}">
      ⚡ Dashboard
    </a>
    <a href="{{ url_for('pages.stats') }}" class="nav-tab {% if request.path == '/stats' %}active{% endif %}">
      📊 Analytics &amp; Stats
    </a>
  </nav>
</header>
<section class="app-content">
  <main>
    {% block content %}{% endblock content %}
  </main>
</section>
</body>
</html>
